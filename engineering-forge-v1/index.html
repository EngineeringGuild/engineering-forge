<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Engineering Forge v1.0 - Game</title>
    <meta
      name="description"
      content="Engineering Forge v1.0 - The ultimate engineering game experience. Build, create, and master engineering challenges."
    />
    <meta name="keywords" content="engineering, game, simulation, learning, technology" />
    <meta name="author" content="Engineering Guild" />
  </head>
  <body>
    <div id="root">
      <div style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-family: Inter, system-ui, sans-serif;
        z-index: 9999;
      ">
        <div style="text-align: center; padding: 2rem;">
          <div style="
            width: 60px;
            height: 60px;
            border: 4px solid rgba(59, 130, 246, 0.3);
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
          "></div>
          <h1 style="font-size: 2rem; font-weight: bold; margin-bottom: 0.5rem;">
            🎮 Engineering Forge V1.0
          </h1>
          <p style="color: #94a3b8; margin-bottom: 1rem;">
            Loading the ultimate engineering game experience...
          </p>
          <div style="
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin: 0 auto;
            overflow: hidden;
          ">
            <div style="
              width: 100%;
              height: 100%;
              background: linear-gradient(90deg, #3b82f6, #8b5cf6);
              animation: loading 2s ease-in-out infinite;
            "></div>
          </div>
        </div>
      </div>
    </div>
    
    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes loading {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
    </style>
    
    <script src="/debug-console.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
